<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scout Group Training Schedule & Sign-up</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f0fdf4; color: #166534; margin: 0; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: #14532d; margin-bottom: 8px; }
        p.subtitle { text-align: center; color: #15803d; margin-top: 0; margin-bottom: 40px; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; border-left: 6px solid #22c55e; }
        .card h3 { margin-top: 0; color: #14532d; }
        .meta { font-size: 14px; color: #4b5563; margin-bottom: 12px; font-weight: 500; }
        .meta span { margin-right: 20px; }
        .form-group { margin-top: 15px; border-top: 1px solid #e5e7eb; padding-top: 15px; }
        input, button { padding: 8px 12px; font-size: 14px; border-radius: 4px; border: 1px solid #d1d5db; margin-right: 8px; margin-top: 6px; }
        button { background: #16a34a; color: white; border: none; cursor: pointer; font-weight: 600; }
        button:hover { background: #15803d; }
        .loading { text-align: center; font-size: 18px; color: #15803d; margin-top: 40px; }
        .msg { font-size: 13px; margin-top: 6px; font-weight: 500; color: #059669; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Local Group Training Portal</h1>
        <p class="subtitle">View upcoming modules and register your attendance</p>
        
        <div id="training-list" class="loading">Loading available training courses...</div>
    </div>

    <script>
        const APPS_SCRIPT_URL = "YOUR_APPS_SCRIPT_URL_HERE";

        async function fetchTrainings() {
            const listDiv = document.getElementById('training-list');
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const data = await response.json();

                if (data.status === "success" && data.trainings.length > 0) {
                    listDiv.innerHTML = ""; 
                    data.trainings.forEach((item, index) => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            <h3>${item.title}</h3>
                            <div class="meta">
                                <span>📅 ${item.date}</span>
                                <span>📍 ${item.location}</span>
                            </div>
                            <p>${item.description}</p>
                            <div class="form-group">
                                <label style="font-size: 13px; font-weight: 600; display: block; color: #374151;">Register for this session:</label>
                                <input type="text" id="name-${index}" placeholder="Full Name" required />
                                <input type="email" id="email-${index}" placeholder="Email Address" required />
                                <button onclick="registerUser('${item.title}', ${index})">Sign Up</button>
                                <div id="msg-${index}" class="msg"></div>
                            </div>
                        `;
                        listDiv.appendChild(card);
                    });
                } else {
                    listDiv.innerHTML = "<p style='text-align:center;'>No training courses currently scheduled.</p>";
                }
            } catch (error) {
                listDiv.innerHTML = "<p style='text-align:center; color: #dc2626;'>Failed to load training schedule.</p>";
                console.error(error);
            }
        }

        async function registerUser(courseTitle, index) {
            const nameInput = document.getElementById(`name-${index}`);
            const emailInput = document.getElementById(`email-${index}`);
            const msgDiv = document.getElementById(`msg-${index}`);

            if (!nameInput.value || !emailInput.value) {
                msgDiv.style.color = "#dc2626";
                msgDiv.innerText = "Please fill in both name and email.";
                return;
            }

            msgDiv.style.color = "#2563eb";
            msgDiv.innerText = "Submitting registration...";

            try {
                // Sending POST request to Apps Script backend
                await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors", // Required for Google Apps Script cross-origin endpoints
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        courseTitle: courseTitle,
                        participantName: nameInput.value,
                        participantEmail: emailInput.value
                    })
                });

                // Since 'no-cors' obscures the response details, we assume success if no error was thrown
                msgDiv.style.color = "#059669";
                msgDiv.innerText = "Successfully registered! Your details have been recorded.";
                nameInput.value = "";
                emailInput.value = "";
            } catch (error) {
                msgDiv.style.color = "#dc2626";
                msgDiv.innerText = "Submission failed. Please try again.";
                console.error(error);
            }
        }

        fetchTrainings();
    </script>

</body>
</html>
