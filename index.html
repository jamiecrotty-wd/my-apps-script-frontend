<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4th Waterford, Abbeyside Scouts | Training Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --scout-purple: #7413dc;
            --scout-teal: #088486;
            --scout-dark: #1f2937;
            --scout-light: #f8fafc;
            --accent-green: #10b981;
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
            background-color: var(--scout-light);
            color: var(--scout-dark);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background: linear-gradient(135deg, var(--scout-purple), #580fa8);
            color: white;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(116, 19, 220, 0.15);
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        header p {
            margin: 8px 0 0 0;
            font-size: 16px;
            opacity: 0.9;
            font-weight: 600;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--scout-purple);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            overflow-x: auto;
            border-top: 5px solid var(--scout-teal);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 750px;
        }

        th {
            background-color: #f3f4f6;
            color: var(--scout-dark);
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 16px 20px;
            border-bottom: 2px solid #e5e7eb;
        }

        td {
            padding: 18px 20px;
            font-size: 14px;
            color: #4b5563;
            border-bottom: 1px solid #f3f4f6;
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f9fafb;
        }

        .course-title {
            font-weight: 700;
            color: var(--scout-dark);
            font-size: 15px;
        }

        .course-desc {
            font-size: 13px;
            color: #6b7280;
            margin-top: 4px;
        }

        input {
            width: 100%;
            padding: 8px 10px;
            font-size: 13px;
            font-family: 'Nunito Sans', sans-serif;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            box-sizing: border-box;
            margin-bottom: 6px;
            outline: none;
        }

        input:focus {
            border-color: var(--scout-purple);
        }

        button {
            background-color: var(--scout-purple);
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 13px;
            font-family: 'Nunito Sans', sans-serif;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #580fa8;
        }

        .loading, .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
            font-weight: 600;
            font-size: 16px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .msg {
            font-size: 12px;
            margin-top: 4px;
            font-weight: 700;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>4th Waterford, Abbeyside Scouts</h1>
        <p>Leader Training Portal & Session Registration</p>
    </header>

    <div class="container">
        <div class="section-title">📅 Upcoming Training Modules</div>
        <div id="training-table-wrapper" class="loading">Loading training schedule...</div>
    </div>

    <script>
        // PASTE YOUR APPS SCRIPT WEB APP URL HERE:
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw9QkAuMZCNCWmY2Cx8x3t8b-0Pl-zJSdmF1nbkPJ6-I6Nzk_zeTzkscQk1hdsih8_v2A/exec";

        async function fetchTrainings() {
            const wrapperDiv = document.getElementById('training-table-wrapper');
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const data = await response.json();

                if (data.status === "success" && data.trainings.length > 0) {
                    let tableHTML = `
                        <div class="table-container">
                            <table>
                               <thead>
                                   <tr>
                                       <th>Training Module</th>
                                       <th>Schedule / Dates</th>
                                       <th>Location</th>
                                       <th style="width: 280px;">Register Attendance</th>
                                   </tr>
                               </thead>
                               <tbody>
                    `;

                    data.trainings.forEach((item, index) => {
                        // Support both 'schedule' or 'date' keys depending on your sheet mapping
                        const scheduleText = item.schedule || item.date || 'TBD';
                        
                        tableHTML += `
                            <tr>
                                <td>
                                    <div class="course-title">${item.title}</div>
                                    <div class="course-desc">${item.description}</div>
                                </td>
                                <td><strong>📅 ${scheduleText}</strong></td>
                                <td>📍 ${item.location}</td>
                                <td>
                                    <input type="text" id="name-${index}" placeholder="Full Name" required />
                                    <input type="email" id="email-${index}" placeholder="Email Address" required />
                                    <button onclick="registerUser('${item.title.replace(/'/g, "\\'")}', ${index})">Sign Up</button>
                                    <div id="msg-${index}" class="msg"></div>
                                </td>
                            </tr>
                        `;
                    });

                    tableHTML += `
                               </tbody>
                            </table>
                        </div>
                    `;

                    wrapperDiv.innerHTML = tableHTML;
                } else {
                    wrapperDiv.innerHTML = `<div class="empty-state">No training courses currently scheduled. Check back soon!</div>`;
                }
            } catch (error) {
                wrapperDiv.innerHTML = `<div class="empty-state" style="color: #dc2626;">Failed to load training schedule. Please check connection.</div>`;
                console.error(error);
            }
        }

        async function registerUser(courseTitle, index) {
            const nameInput = document.getElementById(`name-${index}`);
            const emailInput = document.getElementById(`email-${index}`);
            const msgDiv = document.getElementById(`msg-${index}`);

            if (!nameInput.value || !emailInput.value) {
                msgDiv.style.color = "#dc2626";
                msgDiv.innerText = "Please provide both name & email.";
                return;
            }

            msgDiv.style.color = "#7413dc";
            msgDiv.innerText = "Submitting...";

            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        courseTitle: courseTitle,
                        participantName: nameInput.value,
                        participantEmail: emailInput.value
                    })
                });

                msgDiv.style.color = "#10b981";
                msgDiv.innerText = "Registered successfully!";
                nameInput.value = "";
                emailInput.value = "";
            } catch (error) {
                msgDiv.style.color = "#dc2626";
                msgDiv.innerText = "Failed. Try again.";
                console.error(error);
            }
        }

        fetchTrainings();
    </script>

</body>
</html>
