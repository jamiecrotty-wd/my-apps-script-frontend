<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4th Waterford, Abbeyside Scouts | Training Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --scout-purple: #7413dc;
            --scout-teal: #088486;
            --scout-dark: #1f2937;
            --scout-light: #f8fafc;
            --accent-green: #10b981;
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
            background-color: var(--scout-light);
            color: var(--scout-dark);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background: linear-gradient(135deg, var(--scout-purple), #580fa8);
            color: white;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(116, 19, 220, 0.15);
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        header p {
            margin: 8px 0 0 0;
            font-size: 16px;
            opacity: 0.9;
            font-weight: 600;
        }

        .container {
            max-width: 768px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--scout-purple);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            margin-bottom: 24px;
            border-top: 5px solid var(--scout-teal);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px -5px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            margin: 0 0 12px 0;
            font-size: 20px;
            font-weight: 700;
            color: var(--scout-dark);
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 14px;
            color: #4b5563;
            margin-bottom: 16px;
            background: #f3f4f6;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
        }

        .meta div {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card p {
            color: #4b5563;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .form-section {
            border-top: 1px solid #e5e7eb;
            padding-top: 16px;
            margin-top: 16px;
        }

        .form-section label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--scout-purple);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 600px) {
            .input-row {
                grid-template-columns: 1fr;
            }
        }

        input {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            font-family: 'Nunito Sans', sans-serif;
            border-radius: 8px;
            border: 1.5px solid #d1d5db;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--scout-purple);
        }

        button {
            background-color: var(--scout-purple);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-family: 'Nunito Sans', sans-serif;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #580fa8;
        }

        .loading, .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
            font-weight: 600;
            font-size: 16px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .msg {
            font-size: 13px;
            margin-top: 10px;
            font-weight: 700;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>4th Waterford, Abbeyside Scouts</h1>
        <p>Leader Training Portal & Session Registration</p>
    </header>

    <div class="container">
        <div class="section-title">📅 Upcoming Training Modules</div>
        <div id="training-list" class="loading">Loading training schedule...</div>
    </div>

    <script>
        // PASTE YOUR APPS SCRIPT WEB APP URL HERE:
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw9QkAuMZCNCWmY2Cx8x3t8b-0Pl-zJSdmF1nbkPJ6-I6Nzk_zeTzkscQk1hdsih8_v2A/exec";

        async function fetchTrainings() {
            const listDiv = document.getElementById('training-list');
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const data = await response.json();

                if (data.status === "success" && data.trainings.length > 0) {
                    listDiv.innerHTML = ""; 
                    data.trainings.forEach((item, index) => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            <h3>${item.title}</h3>
                            <div class="meta">
                                <div>📅 <span>${item.schedule}</span></div>
                                <div>📍 <span>${item.location}</span></div>
                            </div>
                            <p>${item.description}</p>
                            <div class="form-section">
                                <label>Register Attendance</label>
                                <div class="input-row">
                                    <input type="text" id="name-${index}" placeholder="Full Name" required />
                                    <input type="email" id="email-${index}" placeholder="Email Address" required />
                                </div>
                                <button onclick="registerUser('${item.title.replace(/'/g, "\\'")}', ${index})">Confirm Sign-Up</button>
                                <div id="msg-${index}" class="msg"></div>
                            </div>
                        `;
                        listDiv.appendChild(card);
                    });
                } else {
                    listDiv.innerHTML = `<div class="empty-state">No training courses currently scheduled. Check back soon!</div>`;
                }
            } catch (error) {
                listDiv.innerHTML = `<div class="empty-state" style="color: #dc2626;">Failed to load training schedule. Please check connection.</div>`;
                console.error(error);
            }
        }

        async function registerUser(courseTitle, index) {
            const nameInput = document.getElementById(`name-${index}`);
            const emailInput = document.getElementById(`email-${index}`);
            const msgDiv = document.getElementById(`msg-${index}`);

            if (!nameInput.value || !emailInput.value) {
                msgDiv.style.color = "#dc2626";
                msgDiv.innerText = "Please provide both your name and email.";
                return;
            }

            msgDiv.style.color = "#7413dc";
            msgDiv.innerText = "Submitting registration...";

            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        courseTitle: courseTitle,
                        participantName: nameInput.value,
                        participantEmail: emailInput.value
                    })
                });

                msgDiv.style.color = "#10b981";
                msgDiv.innerText = "Successfully registered! Your details have been recorded.";
                nameInput.value = "";
                emailInput.value = "";
            } catch (error) {
                msgDiv.style.color = "#dc2626";
                msgDiv.innerText = "Submission failed. Please try again.";
                console.error(error);
            }
        }

        fetchTrainings();
    </script>

</body>
</html>
